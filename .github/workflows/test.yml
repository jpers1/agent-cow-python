name: PostgreSQL matrix

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: postgres-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres:
    name: Python ${{ matrix.python }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            postgres: "14.24"
          - python: "3.10"
            postgres: "18.6"
          - python: "3.11"
            postgres: "18.6"
          - python: "3.12"
            postgres: "14.24"
          - python: "3.12"
            postgres: "15.19"
          - python: "3.12"
            postgres: "16.15"
          - python: "3.12"
            postgres: "17.11"
          - python: "3.12"
            postgres: "18.6"
          - python: "3.13"
            postgres: "18.6"
          - python: "3.14"
            postgres: "18.6"

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60

    env:
      PG_HOST: localhost
      PG_USER: postgres
      PG_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Select PostgreSQL port
        run: echo "PG_PORT=${{ job.services.postgres.ports['5432'] }}" >> "$GITHUB_ENV"

      - name: Install PostgreSQL client library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libpq5

      - name: Install PostgreSQL test dependencies
        run: >-
          python -m pip install
          -e .
          asyncpg==0.31.0
          SQLAlchemy==2.0.46
          pytest==9.0.2
          pytest-asyncio==1.3.0
          pytest-postgresql==8.0.0
          psycopg==3.3.2

      - name: Record environment
        run: |
          python --version
          python - <<'PY'
          import asyncpg
          import psycopg
          import sqlalchemy

          with psycopg.connect(
              host="localhost",
              port=int("${{ job.services.postgres.ports['5432'] }}"),
              user="postgres",
              password="postgres",
              dbname="postgres",
          ) as connection:
              print("PostgreSQL", connection.execute("SHOW server_version").fetchone()[0])
          print("asyncpg", asyncpg.__version__)
          print("SQLAlchemy", sqlalchemy.__version__)
          PY

      - name: Run complete hardened PostgreSQL suite
        run: python -m pytest agentcow/postgres/tests/ -v

      - name: Compile and import package
        run: |
          python -m compileall -q agentcow
          python -c "import agentcow; print(agentcow.__version__)"

  package:
    name: Package / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: python -m pip install build
      - run: python -m build --wheel --sdist

      - name: Install built wheel in a fresh environment
        run: |
          python -m venv /tmp/agentcow-wheel
          /tmp/agentcow-wheel/bin/python -m pip install dist/*.whl
          /tmp/agentcow-wheel/bin/python -c "import agentcow; print(agentcow.__version__)"
