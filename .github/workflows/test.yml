name: PostgreSQL matrix

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: postgres-matrix-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-policy:
    name: Permissive dependency policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --group dev
      - run: .venv/bin/python scripts/check_dependency_policy.py
      - name: Check migrated test/tooling files
        run: |
          .venv/bin/ruff format --check \
            agentcow/postgres/tests/conftest.py \
            scripts/check_dependency_policy.py \
            scripts/test_postgres_matrix.py
          .venv/bin/ruff check \
            agentcow/postgres/tests/conftest.py \
            agentcow/postgres/tests/test_conflict_detection.py \
            agentcow/postgres/tests/test_role_hardening.py \
            scripts/check_dependency_policy.py \
            scripts/test_postgres_matrix.py

  postgres:
    name: Python ${{ matrix.python }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            postgres: "14.24"
          - python: "3.10"
            postgres: "18.6"
          - python: "3.11"
            postgres: "18.6"
          - python: "3.12"
            postgres: "14.24"
          - python: "3.12"
            postgres: "15.19"
          - python: "3.12"
            postgres: "16.15"
          - python: "3.12"
            postgres: "17.11"
          - python: "3.12"
            postgres: "18.6"
          - python: "3.13"
            postgres: "18.6"
          - python: "3.14"
            postgres: "18.6"

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60

    env:
      PG_HOST: localhost
      PG_USER: postgres
      PG_PASSWORD: postgres

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Select PostgreSQL port
        run: echo "PG_PORT=${{ job.services.postgres.ports['5432'] }}" >> "$GITHUB_ENV"

      - name: Install permissive PostgreSQL development environment
        run: |
          python -m pip install uv==0.12.5
          uv sync --frozen --group dev

      - name: Enforce dependency policy
        run: .venv/bin/python scripts/check_dependency_policy.py

      - name: Record environment
        run: |
          .venv/bin/python --version
          .venv/bin/python - <<'PY'
          import asyncio
          import asyncpg
          import sqlalchemy

          async def main():
              connection = await asyncpg.connect(
                  host="localhost",
                  port=int("${{ job.services.postgres.ports['5432'] }}"),
                  user="postgres",
                  password="postgres",
                  database="postgres",
              )
              try:
                  print("PostgreSQL", await connection.fetchval("SHOW server_version"))
              finally:
                  await connection.close()

          asyncio.run(main())
          print("asyncpg", asyncpg.__version__)
          print("SQLAlchemy", sqlalchemy.__version__)
          PY

      - name: Run complete hardened PostgreSQL suite
        run: .venv/bin/python -m pytest agentcow/postgres/tests/ -v

      - name: Compile and import package
        run: |
          .venv/bin/python -m compileall -q agentcow
          .venv/bin/python -c "import agentcow; print(agentcow.__version__)"

  package:
    name: Package / Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - run: python -m pip install uv==0.12.5
      - run: uv sync --frozen --group dev
      - run: .venv/bin/python scripts/check_dependency_policy.py
      - run: .venv/bin/python -m build --no-isolation --wheel --sdist

      - name: Install built wheel in a fresh environment
        run: |
          python -m venv /tmp/agentcow-wheel
          /tmp/agentcow-wheel/bin/python -m pip install dist/*.whl
          /tmp/agentcow-wheel/bin/python -c "import agentcow; print(agentcow.__version__)"
