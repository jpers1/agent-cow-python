[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cow-postgresql"
dynamic = ["version"]
description = "PostgreSQL Copy-On-Write for AI agent workspace isolation"
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Trail Team", email = "help@trail-ml.com"},
]
maintainers = [
    {name = "Janez Perš"},
]
keywords = ["postgresql", "database", "ai", "agents", "copy-on-write", "isolation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
sqlalchemy = [
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
]
[project.urls]
Homepage = "https://github.com/jpers1/agent-cow-postgresql"
Repository = "https://github.com/jpers1/agent-cow-postgresql"
Issues = "https://github.com/jpers1/agent-cow-postgresql/issues"
Upstream = "https://github.com/trail-ml/agent-cow-python"

[tool.setuptools.dynamic]
version = {attr = "agentcow.__version__"}

[tool.setuptools.packages.find]
include = ["agentcow*"]
namespaces = true

[tool.setuptools.package-data]
"agentcow.postgres" = ["README.md"]
"agentcow.scoring" = ["README.md"]

[dependency-groups]
dev = [
    "asyncpg>=0.31,<0.32",
    "build>=1.4,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.15,<0.16",
    "setuptools>=80,<81",
    "sqlalchemy>=2.0.46,<3",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
